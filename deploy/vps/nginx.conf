# Replace this IP and certificate name for another installation.
server {
    listen 80 default_server;
    server_name 168.144.242.231;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://168.144.242.231$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name 168.144.242.231;
    ssl_certificate /etc/letsencrypt/live/forgeflow-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forgeflow-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ForgeFlowTLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 960s;
        proxy_send_timeout 960s;
    }
}
