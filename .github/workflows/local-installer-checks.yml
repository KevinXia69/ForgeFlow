name: local-installer-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native-launchers:
    name: Native launcher and bundle checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.3
      - name: Parse Unix launchers
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n installer/start.sh installer/stop.sh installer/Start-ForgeFlow.command
      - name: Parse PowerShell launchers in a real Windows shell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('installer/Start-ForgeFlow.ps1', 'installer/Stop-ForgeFlow.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse failed: $path" }
          }
      - name: Run native shells against an isolated fake Docker executable
        run: >-
          python -m pytest --noconftest -q
          tests/test_installer_native_shells.py tests/test_installer_bundle.py
          --junitxml=installer-native.xml
      - name: Require executed tests without skips
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          root = ET.parse('installer-native.xml').getroot()
          cases = list(root.iter('testcase'))
          assert cases
          assert not any(child.tag in {'skipped', 'failure', 'error'} for case in cases for child in case)
          print(f'{len(cases)} native-shell/bundle tests; no Docker daemon or provider calls')
      - name: Preserve bounded test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-native-${{ matrix.os }}
          path: installer-native.xml
          if-no-files-found: warn

  source-and-setup:
    name: Source, setup HTTP/browser and frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Python environment
        run: uv sync --frozen --extra planning --extra dsh-sdk
      - name: Check the committed distribution inputs
        run: |
          uv run python scripts/check_distribution.py .
          uv run python scripts/install_reference_knowledge.py --check
      - name: Run local runtime and security regressions
        run: >-
          uv run pytest --noconftest -q
          tests/test_distribution.py tests/test_local_installer_setup.py
          tests/test_local_installer_launchers.py tests/test_workbench_runtime.py
          tests/test_workbench_admission.py tests/test_semantic_local_tls.py
          tests/test_local_stack_acceptance.py
          tests/test_local_provider_catalog.py tests/test_model_protocols.py tests/test_model_transport_safety.py tests/test_dsh_byok.py
          tests/api/test_api_model_connections.py tests/api/test_hosted_security.py
          tests/test_reference_facts.py tests/test_dsh_environment.py tests/test_dsh_reasoning.py
          --junitxml=installer-source.xml
      - name: Require source checks without skips
        run: |
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('installer-source.xml').getroot()
          cases = list(root.iter('testcase'))
          assert cases
          assert not any(child.tag in {'skipped', 'failure', 'error'} for case in cases for child in case)
          print(f'{len(cases)} source/setup tests passed without skips')
          PY
      - name: Install and build the actual public frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Submit the real setup form to a local HTTP fixture
        env:
          FORGEFLOW_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
          CHROME_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/browser/local-setup.mjs
      - name: Verify optional model settings without changing the platform default
        env:
          CHROME_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node web/e2e/model-settings.mjs
      - name: Preserve bounded source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-source-and-setup
          path: installer-source.xml
          if-no-files-found: warn
