[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "forgeflow"
version = "3.10.0"
description = "Manufacturing recovery experiments built on ERP-Bench and Pi"
requires-python = ">=3.12,<3.15"
dependencies = [
  "cryptography==50.0.2",
  "harbor==0.24.0",
  "httpx==0.28.1",
  "openpyxl>=3.1.5",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=7.0.0",
  "python-docx>=1.2.0",
  "python-pptx==1.0.2",
  "python-dotenv==1.2.4",
  "python-multipart>=0.0.33",
  "PyYAML==6.0.3",
]

[project.scripts]
forgeflow = "forgeflow.cli:main"

[project.optional-dependencies]
planning = [
    "odoo-client-lib==2.0.0",
    "ortools==9.15.6755",
]
dsh-sdk = [
    "deepseek-harness-sdk==0.2.1rc2",
]
docmind = [
    "alibabacloud_docmind_api20220711==1.4.15",
]

[dependency-groups]
# The suite exercises the product's planning and ERP paths, so the test
# environment needs the same things the `planning` extra provides. Without
# these, a fresh clone collects fine but 238 tests fail at run time.
dev = [
    "pytest>=8,<10",
    "ruff>=0.14",
    "odoo-client-lib==2.0.0",
    "ortools==9.15.6755",
    "python-pptx==1.0.2",
    "deepseek-harness-sdk==0.2.1rc2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forgeflow"]

[tool.hatch.build.targets.wheel.force-include]
"migrations/control" = "forgeflow/_migrations/control"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# An Odoo addon's models package exists only to import each model module; the
# imports are used by Odoo's registry, not by Python code in this file.
"odoo-addons/**/models/__init__.py" = ["F401"]
