[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "forgeflow"
version = "0.1.0"
description = "Manufacturing recovery experiments built on ERP-Bench and Pi"
requires-python = ">=3.12,<3.15"
dependencies = [
  "cryptography==50.0.2",
  "harbor==0.24.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "PyYAML==6.0.3",
]

[project.scripts]
forgeflow = "forgeflow.cli:main"

[project.optional-dependencies]
planning = [
    "odoo-client-lib==2.0.0",
    "ortools==9.15.6755",
]
dsh-sdk = [
    "deepseek-harness-sdk==0.2.1rc2",
]

[dependency-groups]
# The suite exercises the product's planning and ERP paths, so the test
# environment needs the same things the `planning` extra provides. Without
# these, a fresh clone collects fine but 238 tests fail at run time.
dev = [
    "pytest>=8,<10",
    "ruff>=0.14",
    "odoo-client-lib==2.0.0",
    "ortools==9.15.6755",
    "python-pptx==1.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forgeflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
